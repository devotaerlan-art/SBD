<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kuis Seni Budaya – Tari Nusantara</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f4ff;
    --card: #ffffff;
    --primary: #4361ee;
    --primary-light: #eef0fd;
    --accent: #f72585;
    --success: #06d6a0;
    --danger: #ef233c;
    --warn: #f4a261;
    --text: #1a1a2e;
    --muted: #6c757d;
    --border: #dde3f5;
    --radius: 16px;
    --shadow: 0 4px 24px rgba(67,97,238,.10);
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #4361ee 0%, #7209b7 100%);
    color: #fff;
    padding: 28px 20px 24px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(67,97,238,.35);
  }
  header h1 { font-size: clamp(1.1rem, 4vw, 1.5rem); font-weight: 700; letter-spacing: .5px; }
  header p  { font-size: .82rem; opacity: .85; margin-top: 4px; }

  /* ── Progress bar ── */
  #prog-wrap {
    background: rgba(255,255,255,.25);
    border-radius: 99px;
    height: 8px;
    margin: 14px auto 0;
    max-width: 360px;
    overflow: hidden;
  }
  #prog-bar {
    height: 100%;
    background: #f72585;
    border-radius: 99px;
    transition: width .4s ease;
    width: 0%;
  }

  /* ── Score strip ── */
  #score-strip {
    display: flex;
    justify-content: center;
    gap: 24px;
    padding: 12px 16px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    font-size: .82rem;
    font-weight: 600;
    position: sticky;
    top: 120px;
    z-index: 99;
    flex-wrap: wrap;
  }
  .sstat { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-b { background: var(--success); }
  .dot-s { background: var(--danger); }
  .dot-t { background: var(--primary); }

  /* ── Container ── */
  main { max-width: 780px; margin: 0 auto; padding: 24px 16px; }

  /* ── Question card ── */
  .q-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px 20px 18px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    transition: border-color .3s;
  }
  .q-card.answered-correct { border-color: var(--success); }
  .q-card.answered-wrong   { border-color: var(--danger);  }

  .q-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .q-num {
    font-size: .72rem;
    font-weight: 700;
    background: var(--primary-light);
    color: var(--primary);
    padding: 3px 10px;
    border-radius: 99px;
  }
  .q-badge {
    font-size: .68rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 99px;
  }
  .badge-correct { background: #d4f7ee; color: #068a66; }
  .badge-wrong   { background: #fde8ec; color: #c41030; }

  .q-text {
    font-size: clamp(.88rem, 2.2vw, .97rem);
    font-weight: 500;
    line-height: 1.65;
    margin-bottom: 14px;
  }

  /* ── Options ── */
  .options { display: flex; flex-direction: column; gap: 9px; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: background .2s, border-color .2s, transform .1s;
    font-size: .88rem;
    line-height: 1.55;
    background: #fff;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .opt:hover:not(.disabled) { background: var(--primary-light); border-color: var(--primary); }
  .opt:active:not(.disabled) { transform: scale(.985); }
  .opt.disabled { cursor: default; pointer-events: none; }
  .opt.correct  { background: #d4f7ee; border-color: var(--success); }
  .opt.wrong    { background: #fde8ec; border-color: var(--danger);  }
  .opt.neutral  { opacity: .55; }

  .opt-letter {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 700;
    font-size: .78rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }
  .opt.correct .opt-letter { background: var(--success); color: #fff; }
  .opt.wrong   .opt-letter { background: var(--danger);  color: #fff; }

  /* ── Explanation ── */
  .explanation {
    margin-top: 14px;
    border-radius: 12px;
    overflow: hidden;
    display: none;
  }
  .exp-header {
    font-size: .78rem;
    font-weight: 700;
    padding: 8px 14px;
    letter-spacing: .3px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .exp-correct-h { background: #b7f0de; color: #056a4f; }
  .exp-wrong-h   { background: #f9ccd4; color: #9b0e25; }
  .exp-body {
    background: #f8f9ff;
    padding: 10px 14px 12px;
    font-size: .83rem;
    line-height: 1.65;
    color: #2d3561;
    border: 1px solid #e4e8f8;
    border-top: 0;
    border-radius: 0 0 12px 12px;
  }
  .exp-body strong { color: var(--primary); }
  .exp-options { margin-top: 8px; }
  .exp-opt {
    margin-top: 5px;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: .8rem;
    line-height: 1.5;
  }
  .exp-opt-correct { background: #d4f7ee; }
  .exp-opt-wrong   { background: #ffe8ec; }

  /* ── Result panel ── */
  #result-panel {
    display: none;
    background: var(--card);
    border-radius: var(--radius);
    padding: 30px 24px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    margin-bottom: 30px;
  }
  #result-panel h2 { font-size: 1.4rem; color: var(--primary); margin-bottom: 8px; }
  #result-panel .big-score { font-size: 3rem; font-weight: 700; margin: 12px 0; }
  .grade-A { color: var(--success); }
  .grade-B { color: var(--primary); }
  .grade-C { color: var(--warn); }
  .grade-D { color: var(--danger); }
  #result-panel p { font-size: .9rem; color: var(--muted); line-height: 1.7; }
  #retry-btn {
    margin-top: 18px;
    background: linear-gradient(135deg, #4361ee, #7209b7);
    color: #fff;
    border: none;
    padding: 13px 32px;
    border-radius: 99px;
    font-family: 'Poppins', sans-serif;
    font-size: .92rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
    box-shadow: 0 4px 14px rgba(67,97,238,.35);
  }
  #retry-btn:hover  { opacity: .9; }
  #retry-btn:active { transform: scale(.97); }

  /* ── Floating submit ── */
  #submit-wrap {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(8px);
    padding: 12px 20px;
    box-shadow: 0 -4px 20px rgba(0,0,0,.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    z-index: 200;
  }
  #answered-count { font-size: .82rem; color: var(--muted); font-weight: 500; }
  #submit-btn {
    background: linear-gradient(135deg, #f72585, #b5179e);
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 99px;
    font-family: 'Poppins', sans-serif;
    font-size: .9rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
    box-shadow: 0 4px 14px rgba(247,37,133,.35);
    white-space: nowrap;
  }
  #submit-btn:hover  { opacity: .9; }
  #submit-btn:active { transform: scale(.97); }
  #submit-btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ── Scroll to top ── */
  #top-btn {
    display: none;
    position: fixed;
    bottom: 72px;
    right: 18px;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(67,97,238,.4);
    z-index: 201;
    transition: opacity .3s;
    align-items: center;
    justify-content: center;
  }
  #top-btn.show { display: flex; }
</style>
</head>
<body>

<header>
  <h1>🎭 Kuis Seni Budaya – Tari Nusantara</h1>
  <p>Kurikulum Merdeka · 50 Soal Pilihan Ganda · SMA</p>
  <div id="prog-wrap"><div id="prog-bar"></div></div>
</header>

<div id="score-strip">
  <div class="sstat"><div class="dot dot-b"></div><span id="cnt-benar">Benar: 0</span></div>
  <div class="sstat"><div class="dot dot-s"></div><span id="cnt-salah">Salah: 0</span></div>
  <div class="sstat"><div class="dot dot-t"></div><span id="cnt-total">Dijawab: 0/50</span></div>
</div>

<main id="quiz-main">
  <div id="result-panel">
    <h2>🎉 Hasil Kuis Kamu</h2>
    <div id="big-score" class="big-score"></div>
    <div id="grade-label" style="font-weight:700;font-size:1.1rem;margin-bottom:8px;"></div>
    <p id="result-desc"></p>
    <button id="retry-btn" onclick="retryQuiz()">🔄 Ulangi Kuis</button>
  </div>
  <div id="questions-container"></div>
</main>

<div id="submit-wrap">
  <span id="answered-count">0 dari 50 soal dijawab</span>
  <button id="submit-btn" onclick="submitQuiz()">Kumpulkan Jawaban ✓</button>
</div>

<button id="top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
const questions = [
  // ─── 1-8: MAKNA DAN SIMBOL TARI ───
  {
    q: "Dalam seni tari, simbol gerak yang melambangkan keanggunan dan kehalusan budi pekerti sering ditampilkan melalui…",
    opts: [
      "Gerakan kaki yang menghentak kuat ke lantai",
      "Gerakan tangan yang lembut dan teratur seperti ombak",
      "Lompatan tinggi yang energik dan dinamis",
      "Putaran badan yang cepat tanpa henti"
    ],
    ans: 1,
    exp: [
      "Gerakan menghentak kuat melambangkan kekuatan atau semangat, bukan keanggunan.",
      "BENAR. Gerak tangan lembut dan mengalir seperti ombak adalah simbol keanggunan dan kehalusan budi pekerti, misalnya pada tari Bedhaya Ketawang.",
      "Lompatan energik lebih mencerminkan keberanian atau semangat perang.",
      "Putaran cepat biasanya melambangkan kegembiraan atau keriangan yang meluap."
    ]
  },
  {
    q: "Tari Pendet dari Bali memiliki makna utama sebagai…",
    opts: [
      "Tari hiburan untuk wisatawan asing",
      "Tari persembahan dan penyambutan yang bersifat sakral",
      "Tari perang untuk menolak musuh",
      "Tari pergaulan muda-mudi di pesta rakyat"
    ],
    ans: 1,
    exp: [
      "Tari Pendet memang dipentaskan untuk wisatawan, namun itu bukan makna utama aslinya.",
      "BENAR. Tari Pendet awalnya adalah tari sakral sebagai persembahan kepada para dewa di pura, kemudian berkembang menjadi tari penyambutan tamu.",
      "Tari perang Bali lebih dikenal dengan tari Kecak dalam aspek tertentu atau tari Baris.",
      "Tari pergaulan muda-mudi lebih dikenal sebagai jenis tari sosial, bukan Pendet."
    ]
  },
  {
    q: "Dalam tari tradisional Jawa, gerakan mata (pandangan) yang disebut 'lirikan' berfungsi sebagai…",
    opts: [
      "Hiasan estetis tanpa makna tertentu",
      "Simbol komunikasi batin dan ekspresi emosi tokoh",
      "Tanda bahwa penari kelelahan",
      "Cara penari melihat properti tari"
    ],
    ans: 1,
    exp: [
      "Setiap gerak dalam tari Jawa memiliki makna, tidak ada gerak tanpa arti.",
      "BENAR. Lirikan mata dalam tari Jawa adalah bagian dari wirasa (ekspresi jiwa), menyampaikan emosi, karakter tokoh, dan komunikasi non-verbal kepada penonton.",
      "Penari terlatih tidak menunjukkan kelelahan melalui gerak tari.",
      "Penari sudah hafal posisi properti tanpa harus melihatnya saat pentas."
    ]
  },
  {
    q: "Penggunaan warna kostum merah pada tari tradisional Indonesia umumnya melambangkan…",
    opts: [
      "Kesedihan dan duka cita mendalam",
      "Keberanian, semangat, dan kekuatan",
      "Kesucian dan kemurnian hati",
      "Kebijaksanaan dan ketenangan batin"
    ],
    ans: 1,
    exp: [
      "Warna yang melambangkan kesedihan umumnya adalah hitam atau abu-abu.",
      "BENAR. Merah dalam simbolisme tari tradisional Indonesia melambangkan keberanian, semangat juang, dan kekuatan, sering digunakan pada tokoh ksatria.",
      "Kesucian biasanya dilambangkan dengan warna putih.",
      "Kebijaksanaan biasanya dilambangkan dengan warna emas atau kuning."
    ]
  },
  {
    q: "Tari Barong dari Bali secara simbolis menggambarkan pertarungan antara…",
    opts: [
      "Dua kerajaan yang berperang memperebutkan wilayah",
      "Kekuatan baik (dharma) melawan kekuatan jahat (adharma)",
      "Manusia dengan alam semesta",
      "Dua generasi yang berbeda pandangan"
    ],
    ans: 1,
    exp: [
      "Tari Barong bukan tari tentang perang antar kerajaan.",
      "BENAR. Tari Barong adalah representasi pertarungan abadi antara Barong (kekuatan baik/dharma) dan Rangda (kekuatan jahat/adharma), cerminan filosofi Hindu tentang keseimbangan alam.",
      "Hubungan manusia dengan alam bukan tema utama Tari Barong.",
      "Konflik generasi bukan tema seni tari tradisional Bali ini."
    ]
  },
  {
    q: "Properti tari berupa 'kipas' dalam tari-tari Nusantara umumnya berfungsi sebagai simbol…",
    opts: [
      "Kekuatan fisik dan kejantanan",
      "Keanggunan, kewibawaan, dan kehalusan gerak",
      "Kegelisahan dan ketakutan tokoh",
      "Kemiskinan dan kesederhanaan hidup"
    ],
    ans: 1,
    exp: [
      "Kekuatan dan kejantanan lebih disimbolkan oleh properti seperti keris atau tombak.",
      "BENAR. Kipas dalam tari Nusantara, seperti Tari Kipas dari Sulawesi Selatan, melambangkan keanggunan, kewibawaan, dan memperindah gerak sehingga tampak lebih halus dan berwibawa.",
      "Kegelisahan bukan makna utama properti kipas dalam tari tradisional.",
      "Kipas justru sering identik dengan kemewahan dan kebangsawanan."
    ]
  },
  {
    q: "Makna filosofis dari gerakan 'sembah' di awal dan akhir pertunjukan tari tradisional adalah…",
    opts: [
      "Menunjukkan bahwa penari sudah siap dan selesai",
      "Ekspresi rasa syukur, hormat kepada Tuhan, sesama, dan penonton",
      "Tanda bahwa kostum sudah terpasang dengan benar",
      "Kode antara penari dan pengiring musik"
    ],
    ans: 1,
    exp: [
      "Sembah bukan sekadar sinyal teknis pertunjukan.",
      "BENAR. Gerakan sembah memiliki makna spiritual dan sosial yang dalam, yaitu ungkapan syukur kepada Sang Pencipta, penghormatan kepada leluhur, dan apresiasi kepada penonton.",
      "Kesiapan kostum bukan bagian dari makna gerak sembah.",
      "Komunikasi dengan pengiring musik dilakukan melalui cara lain, bukan gerakan sembah."
    ]
  },
  {
    q: "Dalam tari tradisional, penggunaan 'topeng' sebagai properti terutama berfungsi sebagai simbol…",
    opts: [
      "Menyembunyikan identitas penari karena malu",
      "Perwakilan karakter, watak, atau tokoh tertentu dalam cerita",
      "Pelindung wajah penari dari debu panggung",
      "Hiasan semata agar penampilan lebih menarik"
    ],
    ans: 1,
    exp: [
      "Penari profesional tidak menyembunyikan identitas karena malu.",
      "BENAR. Topeng adalah simbol karakter dan watak tokoh. Warna, bentuk, dan ekspresi topeng mewakili sifat tokoh seperti gagah, bijaksana, jahat, atau lucu.",
      "Fungsi perlindungan bukan tujuan utama topeng dalam seni tari.",
      "Setiap elemen tari memiliki makna, topeng bukan sekadar hiasan."
    ]
  },

  // ─── 9-16: FUNGSI TARI ───
  {
    q: "Tari Bedoyo Ketawang di Keraton Yogyakarta dan Surakarta merupakan contoh tari yang berfungsi sebagai…",

      "Tari pergaulan untuk hiburan masyarakat umum",
      "Tari ritual dan upacara adat kerajaan yang sakral",
      "Tari pertunjukan untuk festival internasional",
      "Tari pendidikan untuk para pelajar"
    ],
    ans: 1,
    exp: [
      "Tari Bedoyo bukan untuk pergaulan umum, sangat eksklusif.",

      "Meski mengandung nilai pendidikan, fungsi utamanya adalah ritual."
    ]
  },
  {
    q: "Fungsi tari sebagai media komunikasi sosial paling tepat terlihat pada…",
    opts: [
      "Penari solo yang berlatih sendiri di studio",
      "Tari pergaulan seperti Tari Poco-Poco yang dimainkan bersama",
      "Pertunjukan tari tunggal di panggung resmi",
      "Video tari yang diunggah ke media sosial"

    ans: 1,
    exp: [
      "Latihan solo tidak secara langsung berfungsi sebagai komunikasi sosial.",

      "Media sosial merupakan medium distribusi, bukan fungsi tari itu sendiri."

  {
    q: "Di beberapa daerah, tari digunakan sebagai media untuk menyembuhkan penyakit dan mengusir roh jahat. Fungsi tari ini disebut…",

      "Fungsi magis dan ritual",
      "Fungsi hiburan sosial",
      "Fungsi pendidikan karakter"

    ans: 1,
    exp: [

  {
    q: "Fungsi tari yang berkaitan dengan menceritakan kisah atau legenda daerah disebut fungsi…",

      "Dramatari atau narasi",

      "Olahraga"

    ans: 1,
    exp: [
      "Rekreasi berarti hiburan ringan tanpa unsur cerita khusus.",
      "BENAR. Fungsi dramatari/narasi adalah menceritakan kisah, legenda, atau epik melalui gerak tari, contohnya Sendratari Ramayana, Tari Kecak yang mengisahkan Ramayana, atau Tari Topeng Cirebon.",

      "Olahraga adalah fungsi fisik, bukan narasi."

  },
  {
    q: "Tari Saman dari Aceh selain berfungsi sebagai seni pertunjukan, juga berfungsi sebagai media…",
    opts: [
      "Kompetisi fisik antar daerah",
      "Dakwah dan penyebaran nilai-nilai agama Islam",
      "Latihan militer bagi pemuda Aceh",
      "Terapi psikologis bagi masyarakat"
    ],
    ans: 1,
    exp: [
      "Tari Saman bukan kompetisi fisik.",
      "BENAR. Tari Saman diciptakan oleh Syekh Saman sebagai media dakwah Islam, menyisipkan syair-syair pujian kepada Allah dan nasihat moral dalam setiap penampilannya.",
      "Meski membutuhkan kekompakan fisik, bukan fungsi militer.",
      "Terapi psikologis bukan fungsi utama yang disematkan pada Tari Saman."
    ]
  },
  {
    q: "Manakah pernyataan yang paling tepat mengenai fungsi tari dalam kehidupan masyarakat modern?",
    opts: [
      "Tari sudah tidak memiliki fungsi ritual karena modernisasi",
      "Tari hanya berfungsi sebagai tontonan di televisi",
      "Tari tetap memiliki fungsi ganda: ritual, sosial, dan hiburan",
      "Fungsi tari semata-mata untuk menghasilkan uang"
    ],
    ans: 2,
    exp: [

// ─── State ───
let answered = {};
let submitted = false;

// ─── Build Quiz ───
function buildQuiz() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  answered = {};
  submitted = false;
  updateScoreStrip();
  updateProgress();

  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `qcard-${qi}`;

    const letters = ['A','B','C','D'];
    const optsHTML = q.opts.map((opt, oi) =>
      `<div class="opt" id="opt-${qi}-${oi}" onclick="chooseAnswer(${qi},${oi})">
        <span class="opt-letter">${letters[oi]}</span>
        <span>${opt}</span>
      </div>`
    ).join('');

    card.innerHTML = `
      <div class="q-meta">
        <span class="q-num">Soal ${qi+1}</span>
        <span class="q-badge" id="badge-${qi}"></span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options">${optsHTML}</div>
      <div class="explanation" id="exp-${qi}"></div>
    `;
    container.appendChild(card);
  });

  document.getElementById('result-panel').style.display = 'none';
  document.getElementById('submit-btn').disabled = false;
  window.scrollTo({top:0,behavior:'smooth'});
}

function chooseAnswer(qi, oi) {
  if (submitted) return;
  if (answered[qi] !== undefined) return; // already answered

  answered[qi] = oi;
  const q = questions[qi];
  const isCorrect = oi === q.ans;

  // style card
  const card = document.getElementById(`qcard-${qi}`);
  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  // style options
  const letters = ['A','B','C','D'];
  q.opts.forEach((_, i) => {
    const el = document.getElementById(`opt-${qi}-${i}`);
    el.classList.add('disabled');
    if (i === q.ans) el.classList.add('correct');
    else if (i === oi && !isCorrect) el.classList.add('wrong');
    else el.classList.add('neutral');
  });

  // badge
  const badge = document.getElementById(`badge-${qi}`);
  badge.textContent = isCorrect ? '✓ Benar' : '✗ Salah';
  badge.className = `q-badge ${isCorrect ? 'badge-correct' : 'badge-wrong'}`;

  // show explanation
  showExplanation(qi, isCorrect);

  updateScoreStrip();
  updateProgress();
  updateAnsweredCount();
}

function showExplanation(qi, isCorrect) {
  const q = questions[qi];
  const el = document.getElementById(`exp-${qi}`);
  const letters = ['A','B','C','D'];
  const headerCls = isCorrect ? 'exp-correct-h' : 'exp-wrong-h';
  const headerText = isCorrect
    ? '✓ Jawaban kamu BENAR! Berikut penjelasan tiap pilihan:'
    : `✗ Jawaban kamu kurang tepat. Jawaban benar: ${letters[q.ans]}. Berikut penjelasan:`;

  const expOpts = q.opts.map((opt, i) => {
    const cls = i === q.ans ? 'exp-opt-correct' : 'exp-opt-wrong';
    return `<div class="exp-opt ${cls}"><strong>${letters[i]}. ${opt}</strong><br>${q.exp[i]}</div>`;
  }).join('');

  el.innerHTML = `
    <div class="exp-header ${headerCls}">${headerText}</div>
    <div class="exp-body">
      <div class="exp-options">${expOpts}</div>
    </div>
  `;
  el.style.display = 'block';
}

function updateScoreStrip() {
  const total = Object.keys(answered).length;
  const benar = Object.entries(answered).filter(([qi,oi]) => questions[qi].ans === oi).length;
  const salah = total - benar;
  document.getElementById('cnt-benar').textContent = `Benar: ${benar}`;
  document.getElementById('cnt-salah').textContent = `Salah: ${salah}`;
  document.getElementById('cnt-total').textContent = `Dijawab: ${total}/50`;
}

function updateProgress() {
  const pct = (Object.keys(answered).length / questions.length) * 100;
  document.getElementById('prog-bar').style.width = pct + '%';
}

function updateAnsweredCount() {
  const n = Object.keys(answered).length;
  document.getElementById('answered-count').textContent = `${n} dari 50 soal dijawab`;
}

function submitQuiz() {
  if (submitted) return;
  const total = Object.keys(answered).length;
  if (total < questions.length) {
    const remaining = questions.length - total;
    if (!confirm(`Masih ada ${remaining} soal yang belum dijawab. Yakin mau kumpulkan sekarang?`)) return;
  }
  submitted = true;
  document.getElementById('submit-btn').disabled = true;

  // Reveal unanswered
  questions.forEach((q, qi) => {
    if (answered[qi] === undefined) {
      const card = document.getElementById(`qcard-${qi}`);
      card.classList.add('answered-wrong');
      const badge = document.getElementById(`badge-${qi}`);
      badge.textContent = '— Tidak Dijawab';
      badge.className = 'q-badge badge-wrong';
      q.opts.forEach((_, i) => {
        const el = document.getElementById(`opt-${qi}-${i}`);
        el.classList.add('disabled');
        if (i === q.ans) el.classList.add('correct');
        else el.classList.add('neutral');
      });
      showExplanation(qi, false);
    }
  });

  const benar = Object.entries(answered).filter(([qi,oi]) => questions[qi].ans === oi).length;
  const nilai = Math.round((benar / questions.length) * 100);

  const panel = document.getElementById('result-panel');
  const bigScore = document.getElementById('big-score');
  const gradeLabel = document.getElementById('grade-label');
  const resultDesc = document.getElementById('result-desc');

  let grade, gradeClass, desc;
  if (nilai >= 90) {
    grade = 'A – Istimewa 🏆'; gradeClass = 'grade-A';
    desc = 'Luar biasa! Kamu sudah sangat siap untuk ulangan besok. Pertahankan semangat belajarmu!';
  } else if (nilai >= 75) {
    grade = 'B – Baik 👍'; gradeClass = 'grade-B';
    desc = 'Bagus sekali! Ulangi kembali materi yang masih salah untuk memastikan nilaimu sempurna besok.';
  } else if (nilai >= 60) {
    grade = 'C – Cukup 📚'; gradeClass = 'grade-C';
    desc = 'Lumayan! Tapi masih perlu belajar lebih giat. Fokus pada soal-soal yang kamu jawab salah tadi.';
  } else {
    grade = 'D – Perlu Belajar Lagi 💪'; gradeClass = 'grade-D';
    desc = 'Jangan menyerah! Baca kembali penjelasan di setiap soal dan minta bantuan guru. Semangat!';
  }

  bigScore.textContent = nilai;
  bigScore.className = `big-score ${gradeClass}`;
  gradeLabel.textContent = grade;
  gradeLabel.className = gradeClass;
  resultDesc.innerHTML = `Kamu menjawab <strong>${benar} benar</strong> dari ${questions.length} soal.<br>${desc}`;

  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function retryQuiz() {
  buildQuiz();
  updateAnsweredCount();
}

// ─── Scroll to top button ───
window.addEventListener('scroll', () => {
  const btn = document.getElementById('top-btn');
  if (window.scrollY > 400) btn.classList.add('show');
  else btn.classList.remove('show');
});

// ─── Init ───
buildQuiz();
updateAnsweredCount();
</script>
